<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Calculator</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
    }

    .card {
      width: 100%;
      max-width: 430px;
      margin: auto;
      padding: 24px;
      border-radius: 22px;
      background: white;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
    }

    h1 {
      margin: 0;
      color: #1e3a8a;
      text-align: center;
      font-size: 27px;
    }

    .subtitle {
      margin: 8px 0 24px;
      color: #64748b;
      text-align: center;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      color: #1e293b;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .result {
      display: none;
      margin-top: 22px;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      font-size: 16px;
      line-height: 1.6;
    }

    .safe {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .warning {
      display: block;
      background: #fef3c7;
      color: #92400e;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #b91c1c;
    }

    .footer {
      margin: 22px 0 0;
      color: #94a3b8;
      text-align: center;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Attendance Calculator</h1>
    <p class="subtitle">Check your lecture attendance</p>

    <label for="subject">Subject Name</label>
    <input id="subject" type="text" placeholder="Example: Mathematics">

    <label for="total">Total Lectures</label>
    <input id="total" type="number" min="1" placeholder="Example: 40">

    <label for="attended">Attended Lectures</label>
    <input id="attended" type="number" min="0" placeholder="Example: 28">

    <label for="target">Target Attendance (%)</label>
    <input id="target" type="number" min="1" max="100" value="75">

    <button onclick="calculateAttendance()">Calculate Attendance</button>

    <section id="result" class="result"></section>

    <p class="footer">Created by a BTech Student</p>
  </main>

  <script>
    function showResult(message, type) {
      const result = document.getElementById("result");
      result.className = "result " + type;
      result.innerHTML = message;
    }

    function calculateAttendance() {
      const subject = document.getElementById("subject").value.trim();
      const total = Number(document.getElementById("total").value);
      const attended = Number(document.getElementById("attended").value);
      const target = Number(document.getElementById("target").value);

      if (!subject || total <= 0 || attended < 0 || target <= 0 || target > 100) {
        showResult("Please enter valid details.", "error");
        return;
      }

      if (attended > total) {
        showResult("Attended lectures cannot be greater than total lectures.", "error");
        return;
      }

      const percentage = (attended / total) * 100;
      const targetDecimal = target / 100;

      if (percentage >= target) {
        const bunkAllowed = Math.floor(attended / targetDecimal - total);

        showResult(
          "<strong>" + subject + "</strong><br>" +
          "Attendance: " + percentage.toFixed(2) + "%<br>" +
          "✅ Your attendance is safe.<br>" +
          "😎 You can bunk the next <strong>" + bunkAllowed +
          "</strong> class(es) and still maintain " + target + "% attendance.",
          "safe"
        );
      } else {
        const needed = Math.ceil(
          (targetDecimal * total - attended) / (1 - targetDecimal)
        );

        showResult(
          "<strong>" + subject + "</strong><br>" +
          "Attendance: " + percentage.toFixed(2) + "%<br>" +
          "⚠️ Attend the next <strong>" + needed +
          "</strong> classes continuously to reach " + target + "%.",
          "warning"
        );
      }
    }
  </script>
</body>
</html>
